  - heading "Signing Verification Settings" [level=4]
  - text: Signature Trust Model
  - radio "Default Trust Model" [checked]
  - text: Default Trust Model
  - paragraph: Use the default repository trust model for this installation.
  - 'radio "Collaborator: Trust signatures by collaborators"'
  - text: "Collaborator: Trust signatures by collaborators"
  - paragraph: Valid signatures by collaborators of this repository will be marked "trusted" - (whether they match the committer or not). Otherwise, valid signatures will be marked "untrusted" if the signature matches the committer and "unmatched" if not.
  - 'radio "Committer: Trust signatures that match committers (This matches GitHub and will force Gitea signed commits to have Gitea as the committer)"'
  - text: "Committer: Trust signatures that match committers (This matches GitHub and will force Gitea signed commits to have Gitea as the committer)"
  - paragraph: "Valid signatures will only be marked \"trusted\" if they match the committer, otherwise they will be marked \"unmatched\". This forces Gitea to be the committer on signed commits with the actual committer marked as Co-authored-by: and Co-committed-by: trailer in the commit. The default Gitea key must match a User in the database."
  - 'radio "Collaborator+Committer: Trust signatures by collaborators which match the committer"'
  - text: "Collaborator+Committer: Trust signatures by collaborators which match the committer"
  - paragraph: "Valid signatures by collaborators of this repository will be marked \"trusted\" if they match the committer. Otherwise, valid signatures will be marked \"untrusted\" if the signature matches the committer and \"unmatched\" otherwise. This will force Gitea to be marked as the committer on signed commits with the actual committer marked as Co-Authored-By: and Co-Committed-By: trailer in the commit. The default Gitea key must match a User in the database."
  - button "Update Settings"
