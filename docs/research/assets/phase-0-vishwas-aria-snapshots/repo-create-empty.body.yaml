- main "New Repository":
  - heading "New Repository" [level=3]
  - paragraph:
    - text: A repository contains all project files, including revision history. Already hosting one elsewhere?
    - link "Migrate repository.":
      - /url: /repo/migrate
  - text: Owner *
  - combobox:
    - img "demo"
    - text: demo
  - text: Some organizations may not show up in the dropdown due to a maximum repository count limit. Repository Name *
  - textbox "Repository Name *"
  - text: Good repository names use short, memorable and unique keywords. Visibility
  - checkbox "Make repository private"
  - text: Make repository private Only the owner or the organization members if they have rights, will be able to see it. Description
  - textbox "Description":
    - /placeholder: Enter short description (optional)
  - text: Template
  - combobox
  - text: Select a template. Issue Labels
  - combobox
  - text: Select an issue label set. .gitignore
  - combobox
  - text: Select .gitignore templates. Choose which files not to track from a list of templates for common languages. Typical artifacts generated by each language's build tools are included on .gitignore by default. License
  - combobox
  - text: Select a license file. A license governs what others can and can't do with your code. Not sure which one is right for your project? See
  - link "Choose a license.":
    - /url: https://choosealicense.com/
  - text: README
  - combobox: Default
  - text: This is the place where you can write a complete description for your project.
  - checkbox "Initialize Repository (Adds .gitignore, License and README)"
  - text: Initialize Repository (Adds .gitignore, License and README) Default Branch
  - textbox "Default Branch":
    - /placeholder: main
    - text: main
  - text: The default branch is the base branch for pull requests and code commits. Object Format
  - combobox: sha1
  - text: Object format of the repository. Cannot be changed later. SHA1 is most compatible. Template
  - checkbox "Make repository a template"
  - text: Make repository a template
  - button "Create Repository"
