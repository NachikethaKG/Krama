[project]
name = "krama-backend"
version = "0.1.0"
description = "Krama agent, verifier and API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "playwright>=1.63",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ['^\.venv/']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
