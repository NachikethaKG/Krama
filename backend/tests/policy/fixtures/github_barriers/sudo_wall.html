<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Confirm access · GitHub</title>
</head>
<body>
  <div class="auth-form">
    <h1>Confirm password to continue</h1>
    <form action="/sudo" method="post">
      <label for="sudo_password">Password</label>
      <input type="password" id="sudo_password" name="sudo_password" autocomplete="current-password" autofocus required>
      <button type="submit" class="btn btn-primary">Confirm password</button>
    </form>
  </div>
</body>
</html>
