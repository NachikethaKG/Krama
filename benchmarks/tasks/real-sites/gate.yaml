# Phase 7 exit gate (#481, #482): 12 public sites x 2 tasks, held out from development (the spike used Wikipedia,
# OpenStreetMap, TodoMVC, the Python docs and MDN). `account: own` sites need the owner's own free account: sign in
# once on /sites before the run. No banking, payment or other sensitive sites (AGENTS.md §4).
#
# success: what the final page of a verified run must show. url_matches is a regex on path?query (#463);
# title_contains on the page title. A task without `success` counts on the run's own verification.
# Tasks on the same site run in file order (a card goes on the board the task before created).

tasks:
  # --- no account ---------------------------------------------------------------------------------------------
  - name: gutenberg-search
    site: Project Gutenberg
    target: https://www.gutenberg.org
    prompt: Search Project Gutenberg for Pride and Prejudice and open the book's page
    success: { url_matches: "^/ebooks/\\d+" }
  - name: gutenberg-top
    site: Project Gutenberg
    target: https://www.gutenberg.org
    prompt: Open the list of the most downloaded books
    success: { url_matches: "^/browse/scores/top" }

  # RubyGems, crates.io and MusicBrainz replaced PyPI, npm and timeanddate.com (2026-11-28, #482): those three
  # show every headless browser a CAPTCHA (Fastly's "Client Challenge" on PyPI), so no model could do their
  # tasks and Krama rightly pauses; it never gets past a bot check (AGENTS.md §4). The new ones were checked
  # with Krama's headless browser and the policy's barrier check first.
  - name: rubygems-search
    site: RubyGems
    target: https://rubygems.org
    prompt: Search RubyGems for the rails gem and open its page
    success: { url_matches: "^/gems/rails/?$" }
  - name: rubygems-versions
    site: RubyGems
    target: https://rubygems.org
    prompt: Open the list of versions of the rack gem
    success: { url_matches: "^/gems/rack/versions" }

  - name: crates-search
    site: crates.io
    target: https://crates.io
    prompt: Search crates.io for the serde crate and open its page
    success: { url_matches: "^/crates/serde/?$" }
  - name: crates-versions
    site: crates.io
    target: https://crates.io
    prompt: Open the list of published versions of the tokio crate
    success: { url_matches: "^/crates/tokio/versions" }

  - name: wiktionary-word
    site: Wiktionary
    target: https://en.wiktionary.org
    prompt: Look up the word serendipity on Wiktionary
    success: { url_matches: "^/wiki/serendipity" }
  - name: wiktionary-word-of-the-day
    site: Wiktionary
    target: https://en.wiktionary.org
    prompt: Open Wiktionary's Word of the day page
    success: { url_matches: "Word_of_the_day" }

  - name: httpbin-order
    site: httpbin.org test form
    target: https://httpbin.org/forms/post
    prompt: Fill in the pizza order form for the customer Asha, size Medium, topping Bacon, then submit it
    success: { url_matches: "^/post" }
  - name: httpbin-delivery
    site: httpbin.org test form
    target: https://httpbin.org/forms/post
    prompt: Fill in the pizza order form for the customer Ravi with delivery time 11:30 and the comment Ring the bell, then submit it
    success: { url_matches: "^/post" }

  - name: herokuapp-checkboxes
    site: the-internet (test playground)
    target: https://the-internet.herokuapp.com
    prompt: Open the Checkboxes example and tick the first checkbox
    success: { url_matches: "^/checkboxes" }
  - name: herokuapp-dropdown
    site: the-internet (test playground)
    target: https://the-internet.herokuapp.com
    prompt: Open the Dropdown example and choose Option 2
    success: { url_matches: "^/dropdown" }

  - name: musicbrainz-artist
    site: MusicBrainz
    target: https://musicbrainz.org
    prompt: Search MusicBrainz for the artist Radiohead and open the artist's page
    success: { url_matches: "^/artist/[0-9a-f-]{36}" }
  - name: musicbrainz-album
    site: MusicBrainz
    target: https://musicbrainz.org
    prompt: Find the album OK Computer by Radiohead on MusicBrainz and open its page
    success: { url_matches: "^/(release-group|release)/[0-9a-f-]{36}" }

  - name: archive-search
    site: Internet Archive
    target: https://archive.org
    prompt: Search the Internet Archive for Apollo 11 and open the first result
    success: { url_matches: "^/details/" }
  - name: archive-wayback
    site: Internet Archive
    target: https://web.archive.org
    prompt: Look up example.com in the Wayback Machine
    success: { url_matches: "example\\.com" }

  # --- the owner's own free account (sign in on /sites first) ----------------------------------------------------
  - name: trello-board
    site: Trello
    target: https://trello.com
    account: own
    prompt: Create a board named Reading list
  # Was "Add a card called Buy milk to the first list of the Reading list board" (#482, 2026-11-26): a new
  # Trello board starts with no lists, so that card had nowhere to go. Adding a list works on an empty board.
  - name: trello-list
    site: Trello
    target: https://trello.com
    account: own
    prompt: Add a list called To read to the Reading list board

  # Habitica replaced Todoist (2026-11-24): Todoist's sign-in runs an invisible CAPTCHA that rejects Krama's
  # browser, with nothing for the owner to solve; Krama never gets around bot checks (AGENTS.md §4).
  - name: habitica-add
    site: Habitica
    target: https://habitica.com
    account: own
    prompt: Add a to-do called Water the plants
  - name: habitica-complete
    site: Habitica
    target: https://habitica.com
    account: own
    prompt: Mark the to-do Water the plants as done

  - name: codeberg-repo
    site: Codeberg
    target: https://codeberg.org
    account: own
    prompt: Create a new repository named notes-demo
    success: { url_matches: "/notes-demo" }
  - name: codeberg-issue
    site: Codeberg
    target: https://codeberg.org
    account: own
    prompt: Open an issue titled Fix typo in README in the repository notes-demo
    success: { url_matches: "/issues/\\d+" }

  - name: gitlab-project
    site: GitLab.com
    target: https://gitlab.com
    account: own
    prompt: Create a blank project named notes-demo
    success: { url_matches: "/notes-demo" }
  - name: gitlab-issue
    site: GitLab.com
    target: https://gitlab.com
    account: own
    prompt: Create an issue titled Fix typo in README in the project notes-demo
    success: { url_matches: "/-/issues/\\d+" }
