name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    name: Ownership report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_ownership.py --base origin/${{ github.base_ref }}

  hooks:
    name: Hygiene hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      # check-ownership needs a local identity, so CI uses the report job above instead
      - run: SKIP=check-ownership pre-commit run --all-files --show-diff-on-failure

  # The jobs below turn on automatically once their folder exists, so no shared CI edit is needed then.
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    # Same Postgres as infra/docker-compose.yml, so the DB tests (backend/tests/db) run here instead of skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: krama
          POSTGRES_PASSWORD: krama-local-only
          POSTGRES_DB: krama
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U krama"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis for the arq run worker tests (backend/tests/runs/test_worker.py, #95); they skip without it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - id: exists
        working-directory: .
        run: echo "yes=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.yes == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.exists.outputs.yes == 'true'
        run: uv sync --frozen
      # Headless Chromium for the Playwright tests (backend/tests/agent). Tests marked `gitea` skip here.
      - if: steps.exists.outputs.yes == 'true'
        run: uv run playwright install --with-deps chromium
      - if: steps.exists.outputs.yes == 'true'
        run: uv run ruff check . && uv run ruff format --check .
      - if: steps.exists.outputs.yes == 'true'
        run: uv run mypy .
      - if: steps.exists.outputs.yes == 'true'
        run: uv run pytest
        env:
          LLM_PROVIDER: fake
      # The benchmarks (Nachiketha's, benchmarks/) live outside backend/, so the steps above never see them.
      - if: steps.exists.outputs.yes == 'true'
        name: Benchmarks (mypy, tests)
        run: uv run mypy ../benchmarks && uv run pytest ../benchmarks/tests -o addopts=""
        env:
          LLM_PROVIDER: fake
          DATABASE_URL: postgresql+asyncpg://krama:krama-local-only@localhost:5433/krama
          # A missing database fails the DB tests here instead of skipping them (locally they skip).
          KRAMA_REQUIRE_DB: "1"

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: echo "yes=$([ -f pnpm-workspace.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.yes == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.exists.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.exists.outputs.yes == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.exists.outputs.yes == 'true'
        run: pnpm -r lint && pnpm -r typecheck && pnpm -r test && pnpm -r build
        env:
          NEXT_PUBLIC_API_MODE: mock
      - if: steps.exists.outputs.yes == 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium && pnpm e2e
        env:
          NEXT_PUBLIC_API_MODE: mock

  contracts-drift:
    name: Contracts drift (generated code up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install rust-just
      - name: Install backend dependencies (Python generator + openapi export)
        working-directory: backend
        run: uv sync --frozen
      # Node is only needed once the TypeScript generator exists (#17); `just gen-contracts` skips it otherwise.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate everything derived from contracts/
        run: just gen-contracts
      - name: Fail if anything changed or appeared
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated contract code is out of date. Run 'just gen-contracts' and commit the result (KRAMA_GEN=1 git commit ...)."
            git status --porcelain
            git --no-pager diff --stat
            git --no-pager diff | head -100
            exit 1
          fi
          echo "Generated code matches contracts/."
