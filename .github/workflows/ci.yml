name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ownership:
    name: Ownership report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_ownership.py --base origin/${{ github.base_ref }}

  # backend, frontend and contracts-drift jobs are added by the PRs that create those folders.
